<style>
:root{
  color-scheme:light;
  --bg:#eef1f8; --surface:#ffffff; --surface-2:#f6f8fc; --sunken:#eaeef7;
  --line:#dfe5f0; --line-strong:#cfd8e8;
  --ink:#0d1526; --ink-2:#3d4a63; --ink-3:#6b7891; --ink-4:#93a0b8;
  --accent:#2563eb; --accent-2:#1d4ed8; --accent-bg:#e8efff; --accent-edge:#c3d6ff;
  --ok:#0d9488; --ok-bg:#dcf5f1; --warn:#c2670a; --warn-bg:#fdf0dc;
  --bad:#d32f2f; --bad-bg:#fde9e9; --hold:#0e7490; --hold-bg:#dcf1f7;
  --ai:#7c3aed; --ai-bg:#f2ecff;
  --shadow:0 4px 14px rgba(13,21,38,.07),0 1px 3px rgba(13,21,38,.05);
  --shadow-lg:0 18px 44px rgba(13,21,38,.14),0 3px 10px rgba(13,21,38,.07);
  --r:12px; --r-sm:8px; --r-lg:18px;
  --sans:'Plus Jakarta Sans',ui-sans-serif,system-ui,-apple-system,'Segoe UI',sans-serif;
  --mono:'IBM Plex Mono',ui-monospace,'SF Mono',Menlo,monospace;
}
*{box-sizing:border-box}
html,body{height:100%}
html{overflow-x:hidden;width:100%}
body{overflow-x:hidden;width:100%;max-width:100%}
.app,.work,.main,.nav,.demo{min-width:0}
body{margin:0;display:flex;flex-direction:column;height:var(--vh);background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:14px;line-height:1.45;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.mono{font-family:var(--mono)}
svg.i{width:17px;height:17px;flex:none;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}

/* demo bar — same as the campaigns prototype */
.demo{background:var(--surface);border-bottom:1px solid var(--line);padding:8px 16px;display:flex;flex-wrap:wrap;gap:6px 12px;align-items:center;font-size:12px}
.demo b{font-weight:700;letter-spacing:.06em;text-transform:uppercase;font-size:10.5px;color:var(--ink-3)}
.demo .chips{display:flex;flex-wrap:wrap;gap:4px}
.demo button{background:var(--surface-2);border:1px solid var(--line);border-radius:999px;padding:4px 11px;font-size:12px;color:var(--ink-2);font-weight:600}
.demo button[aria-pressed="true"]{background:var(--accent);color:#fff;border-color:var(--accent)}
.demo .sep{width:1px;height:18px;background:var(--line)}
.demo .why{flex-basis:100%;color:var(--ink-3)}
.demo .why strong{color:var(--ink)}
.demo .rules{margin-left:auto;background:var(--ai-bg)!important;color:var(--ai)!important;border-color:#ddccff!important}
.demo .tst[aria-pressed="true"]{background:var(--warn)!important;border-color:var(--warn)!important}

/* chrome */
.app{flex:1;min-height:0;display:grid;grid-template-rows:auto 1fr}
.nav{display:flex;align-items:center;gap:14px;padding:10px 18px;background:var(--surface);border-bottom:1px solid var(--line)}
.logo{width:30px;height:30px;border-radius:var(--r-sm);background:var(--accent);display:grid;place-items:center}
.logo svg{stroke:#fff}
.tabsnav{display:flex;gap:4px}
.tabsnav a{display:flex;gap:7px;align-items:center;padding:7px 11px;border-radius:9px;color:var(--ink-2);text-decoration:none;font-weight:600;font-size:13.5px}
.tabsnav a.on{background:var(--accent-bg);color:var(--accent-2)}
.search{flex:1;max-width:340px;display:flex;align-items:center;gap:8px;border:1px solid var(--line);border-radius:10px;padding:7px 11px;color:var(--ink-3);background:var(--surface-2)}
.search kbd{margin-left:auto;font-family:var(--mono);font-size:11px;border:1px solid var(--line);border-radius:5px;padding:1px 5px}
.navright{margin-left:auto;display:flex;align-items:center;gap:8px}
.me{display:flex;align-items:center;gap:9px}
.me .av{width:34px;height:34px;border-radius:50%;background:#F3D9D2;color:#6B2A1A;display:grid;place-items:center;font-weight:800;font-size:12.5px}
.me .t{line-height:1.2}
.me .t b{display:block;font-size:13px}
.me .t span{font-size:11.5px;color:var(--ink-3)}
.bell{position:relative}
.bell i{position:absolute;top:-4px;right:-4px;background:var(--bad);color:#fff;font-style:normal;font-size:10px;font-weight:700;border-radius:999px;padding:0 5px;line-height:16px}

.work{display:grid;grid-template-columns:64px 236px 1fr;min-height:0}
.rail{background:var(--surface);border-right:1px solid var(--line);display:flex;flex-direction:column;align-items:center;gap:4px;padding:10px 0;overflow:auto}
.rail a{display:flex;flex-direction:column;align-items:center;gap:3px;width:54px;padding:8px 0;border-radius:10px;color:var(--ink-3);text-decoration:none;font-size:10.5px;font-weight:600;text-align:center}
.rail a.on{background:var(--accent-bg);color:var(--accent-2)}
.rail a.gone{opacity:.28;text-decoration:line-through}
.sub{background:var(--surface);border-right:1px solid var(--line);padding:14px 10px;display:flex;flex-direction:column;gap:2px;overflow:auto}
.sub h2{display:flex;align-items:center;gap:10px;font-size:15px;font-weight:800;margin:0 4px 12px}
.sub h2 span{width:30px;height:30px;border-radius:9px;background:var(--accent);display:grid;place-items:center}
.sub h2 svg{stroke:#fff}
.sub .grp{font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--ink-4);font-weight:700;margin:12px 10px 4px}
.sub button{display:flex;align-items:center;gap:10px;width:100%;border:0;background:none;padding:9px 10px;border-radius:10px;font-weight:600;font-size:13.5px;color:var(--ink-2);text-align:left}
.sub button:hover{background:var(--surface-2)}
.sub button.on{background:var(--accent-bg);color:var(--accent-2)}
.sub button .n{margin-left:auto;font-family:var(--mono);font-size:11px;background:var(--sunken);border-radius:999px;padding:0 7px;color:var(--ink-2)}
.sub button.dim{color:var(--ink-4)}
.sub .scope{margin-top:auto;border:1px solid var(--line);border-radius:12px;padding:10px 12px;background:var(--surface-2);font-size:12px;color:var(--ink-2)}
.sub .scope b{display:block;font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-3);margin-bottom:3px}

.main{overflow:auto;min-height:0;padding:20px 24px 40px;position:relative}
.main.editing{padding-bottom:0}
.ph{display:flex;align-items:flex-end;gap:16px;flex-wrap:wrap;margin-bottom:16px}
.ph .eyebrow{font-size:11px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--accent-2);margin:0 0 4px}
.ph h1{font-size:26px;font-weight:800;letter-spacing:-.02em;margin:0}
.ph p{margin:4px 0 0;color:var(--ink-3);max-width:74ch}
.ph .act{margin-left:auto;display:flex;gap:8px;flex-wrap:wrap}
.back{border:0;background:none;color:var(--ink-3);font-weight:600;display:flex;gap:6px;align-items:center;padding:0;margin-bottom:8px}
.btn{display:inline-flex;align-items:center;gap:7px;border:1px solid var(--line-strong);background:var(--surface);border-radius:10px;padding:8px 13px;font-weight:700;font-size:13px;color:var(--ink-2);white-space:nowrap}
.btn:hover{border-color:var(--accent-edge);color:var(--accent-2);background:var(--accent-bg)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.primary:hover{background:var(--accent-2)}
.btn.danger{color:var(--bad);border-color:#f3c2c2}
.btn.danger:hover{background:var(--bad-bg)}
.btn.dangerfill{background:var(--bad);border-color:var(--bad);color:#fff}
.btn.sm{padding:5px 10px;font-size:12px;border-radius:8px}
.btn:disabled,.ib:disabled{opacity:.42;cursor:not-allowed}

/* ===================== redesign layer ===================== */
:root{
  --bg:#f5f7fb;--line:#e4e8f0;--line-strong:#d0d8e6;
  --ink-3:#5f6c85;--ink-4:#8592ab;
  --r:10px;--r-lg:14px;
  --shadow:0 1px 2px rgba(13,21,38,.05);
  --shadow-lg:0 18px 44px rgba(13,21,38,.16),0 3px 10px rgba(13,21,38,.08);
}

/* prototype bar: one slim dark strip, out of the product's way */
.demo{background:#101828;color:#cbd5e1;border-bottom:0;padding:7px 18px;gap:6px 12px;font-size:12px}
.demo b{color:#94a3b8;font-size:10px;letter-spacing:.12em}
.demo .brand{font-size:10px;letter-spacing:.14em;font-weight:800;text-transform:uppercase;color:#101828;background:#fbbf24;border-radius:5px;padding:2px 7px}
.demo button,.demo .ssel{background:rgba(255,255,255,.08);border:1px solid transparent;color:#e2e8f0;font-size:12px;font-weight:600}
.demo button{border-radius:999px;padding:3px 11px}
.demo button:hover{background:rgba(255,255,255,.16)}
.demo button[aria-pressed="true"]{background:#3b82f6;color:#fff;border-color:#3b82f6}
.demo .sep{background:rgba(255,255,255,.2)}
.demo .grow{flex:1}
.demo .ssel{border-radius:8px;padding:4px 26px 4px 10px;font-family:inherit;border-color:rgba(255,255,255,.18);max-width:190px}
.demo .ssel option{color:#101828;background:#fff}
.demo .whybtn{width:26px;height:26px;padding:0;display:inline-grid;place-items:center}
.demo .whybtn svg.i{width:15px;height:15px}
.demo .why{display:none;flex-basis:100%;color:#cbd5e1;padding:7px 0 1px;margin-top:2px;border-top:1px solid rgba(255,255,255,.14)}
.demo.why-open .why{display:block}
.demo .why strong{color:#fff}
.demo .why span{color:#94a3b8!important}
.demo .rules{margin-left:0;background:rgba(167,139,250,.22)!important;color:#ddd6fe!important;border-color:transparent!important}
.demo .tst[aria-pressed="true"]{background:var(--warn)!important;border-color:var(--warn)!important;color:#fff!important}
.demo .v1{color:#fcd34d;font-size:11.5px;font-weight:700;text-decoration:none;border:1px solid rgba(252,211,77,.45);border-radius:999px;padding:2px 10px}
.demo .v1:hover{background:rgba(252,211,77,.14)}

/* top bar and sidebar */
.nav{padding:8px 20px}
.search{background:var(--surface-2);max-width:380px}
.sub{padding:12px 10px}
.sub .hsec{font-weight:600;color:var(--ink)}
.sub .hitems button.on{font-weight:700}
.sub button.on{background:var(--accent-bg);color:var(--accent-2)}

/* page frame */
.main{padding:24px 32px 48px}
.main:not(.editing)>*{max-width:100%}
.ph{align-items:flex-start;margin-bottom:12px}
.ph .eyebrow{font-size:12px;letter-spacing:0;text-transform:none;font-weight:600;color:var(--ink-3);margin-bottom:6px}
.ph h1{font-size:24px}
.ph p{font-size:13.5px;max-width:66ch;margin-top:4px}
.ph .act{padding-top:14px}

/* tabs instead of numbered pills */
.steps{gap:2px;margin:0 0 18px;border-bottom:1px solid var(--line);flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none}
.steps button{border:0;border-bottom:2px solid transparent;border-radius:0;background:none;padding:10px 14px;margin-bottom:-1px;font-size:13.5px;font-weight:600;color:var(--ink-3);white-space:nowrap}
.steps button:hover:not(:disabled){color:var(--ink)}
.steps button[aria-pressed="true"]{background:none;border-bottom-color:var(--accent);color:var(--accent-2)}
.steps .tc{margin-left:7px;font-family:var(--mono);font-size:11px;background:var(--sunken);border-radius:999px;padding:0 7px;color:var(--ink-2)}
.steps button[aria-pressed="true"] .tc{background:var(--accent-bg);color:var(--accent-2)}

/* controls */
.btn{min-height:34px;border-radius:9px;padding:0 14px;font-weight:600}
.btn.sm{min-height:28px;padding:0 10px}
.btn.primary{box-shadow:0 1px 2px rgba(37,99,235,.35)}
.ib{width:32px;height:32px;border-color:transparent;background:transparent;color:var(--ink-3)}
.ib[aria-label="Delete"]:hover:not(:disabled){background:var(--bad-bg);color:var(--bad);border-color:transparent}
.sbox{min-height:36px;border-radius:9px}
.seg{border-radius:9px}
.toolbar{gap:10px 12px;margin-bottom:14px}

/* stat strip instead of four big cards */
.kpis{gap:0;background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);box-shadow:var(--shadow);overflow:hidden;margin-bottom:18px}
.kpi{display:grid;grid-template-columns:auto 1fr;align-items:baseline;column-gap:10px;border:0;border-right:1px solid var(--line);border-radius:0;box-shadow:none;padding:12px 18px}
.kpi:last-child{border-right:0}
.kpi b{grid-column:1/-1}
.kpi .v{font-size:22px;margin:2px 0 0}
.kpi .s{margin:0;align-self:end;padding-bottom:3px}

/* tables */
.tbl th{font-size:11px;letter-spacing:.06em;padding:10px 16px}
.tbl td{padding:14px 16px}
.tbl .acts .ib{opacity:.6}
.tbl tr:hover .acts .ib{opacity:1}
.tbl input[type=checkbox]{accent-color:var(--accent);width:16px;height:16px}
.cname{max-width:520px}
.cname .rn{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.cname .rn b{display:inline;font-size:14px}
.cname .rn .sm2{display:inline;margin:0}
.cname .key{font-family:var(--mono);font-size:10.5px;color:var(--ink-3);border:1px solid var(--line);border-radius:5px;padding:0 6px;line-height:17px}
.cname .rd{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;font-size:12.5px;color:var(--ink-3);margin-top:3px;white-space:normal;max-width:60ch}
.accl{display:flex;align-items:center;gap:10px;font-size:12.5px}
.accl .num small{color:var(--ink-3);font-weight:500}
.accl .meter{width:64px;height:6px}
.sens{display:inline-block;margin-top:4px;font-size:11.5px;font-weight:700;color:var(--bad)}

/* selection bar, empty states */
.bulk{display:flex;align-items:center;gap:8px;margin-left:auto;background:var(--accent-bg);border:1px solid var(--accent-edge);border-radius:10px;padding:3px 4px 3px 12px;color:var(--accent-2);font-size:13px}
.hintr{margin-left:auto;font-size:12.5px;color:var(--ink-3)}
.empty{display:flex;flex-direction:column;align-items:center;gap:6px;padding:40px 16px;color:var(--ink-3);text-align:center;font-size:13px}
.empty svg.i{width:28px;height:28px;color:var(--ink-4)}
.empty b{color:var(--ink);font-size:14px}

/* editor keeps its layout, adjusted to the new page padding */
.main.editing .edhead{margin:-24px -32px 16px;top:-24px;padding:12px 32px}
.mod{scroll-margin-top:96px}

@media (max-width:1056px){.kpis{grid-template-columns:repeat(2,1fr)}.kpi:nth-child(2){border-right:0}.kpi:nth-child(-n+2){border-bottom:1px solid var(--line)}}
@media (max-width:880px){.main{padding:20px 20px 40px}.main.editing .edhead{margin:-20px -20px 16px;top:-20px;padding:12px 20px}.demo .grow{display:none}}
@media (max-width:608px){.main{padding:14px 14px 32px}.main.editing .edhead{margin:-14px -14px 14px;top:-14px;padding:10px 14px}.ph h1{font-size:21px}.ph .act{padding-top:0;width:100%}.kpis{grid-template-columns:1fr 1fr}.bulk,.hintr{margin-left:0;width:100%}.demo .ssel{max-width:none}.demo .v1{display:none}}
@media (max-width:608px){.demo:not(.why-open){flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none}.demo:not(.why-open)>*{flex:none}.demo .chips{flex-wrap:nowrap}}
.ed{grid-template-columns:minmax(0,1fr)}

.apick .ac button:not(.has):not(.on){color:var(--ink-3)}

/* whole UI drawn at 80% so it matches the browser's 80% zoom while the browser stays at 100% */
:root{--ui-zoom:0.8;--vh:calc(100vh / 0.8)}
html{zoom:0.8}
/* the 80% desktop density doesn't apply on phones/tablets — and CSS zoom silently
   scales every max-width breakpoint below by 1/0.8, so responsive layouts never
   triggered at their real, intended widths while it stayed active here */
@media (max-width:1024px){
 :root{--ui-zoom:1;--vh:100vh}
 html{zoom:1}
}

.epplayer button.ib{border:0;background:none;color:var(--ink-2);flex:none;width:22px;height:22px}
.epplayer button.ib svg.i{width:15px;height:15px}
.eptime{font-family:var(--mono);font-size:11.5px;color:var(--ink-2);flex:none;white-space:nowrap}
.epseek{flex:1;height:4px;border-radius:2px;background:var(--line-strong);position:relative;min-width:40px}
.epseek i{position:absolute;left:0;top:0;bottom:0;border-radius:2px;background:var(--ink-3)}
.epvol,.epmore{color:var(--ink-3);display:inline-flex;flex:none}
.epvol svg.i,.epmore svg.i{width:15px;height:15px}
.epclose{border-color:var(--bad);color:var(--bad);flex:none}
.eskhead2{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;margin-bottom:16px}
.eskhead2 h3{margin:0}
.eskhead2 p{margin:4px 0 0}
.eskhead2 .btn{flex:none}
.esktbl{border:1px solid var(--line);border-radius:8px;overflow:hidden}
.eskrow{display:flex;align-items:center;justify-content:space-between;gap:14px;padding:12px 16px;border-top:1px solid var(--line)}
.esktbl>.eskrow:first-child{border-top:0}
.eskrow.eskcol{background:var(--surface-2);font-size:11px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;color:var(--ink-3);padding:9px 16px}
.eskgrp{display:flex;justify-content:space-between;background:var(--surface-2);padding:9px 16px;border-top:1px solid var(--line);font-size:12.5px}
.esktbl>.eskgrp:first-of-type{border-top:0}
.eskgrp b{font-weight:700;color:var(--ink-2)}
.eskgrp span{color:var(--ink-3)}
.eskrow>div:first-child b{display:block;font-size:13.5px;font-weight:600;color:var(--ink)}
.eskrow>div:first-child span{display:block;font-size:12px;color:var(--ink-3);margin-top:2px}
.eskstars{display:flex;align-items:center;gap:3px;flex:none}
.eskstar{border:0;background:none;padding:2px;cursor:pointer;color:var(--ink-4);display:inline-flex}
.eskstar svg.i{width:16px;height:16px;fill:none;stroke:currentColor}
.eskstar.on{color:var(--warn)}
.eskstar.on svg.i{fill:currentColor}
.eskn{font-size:12px;color:var(--ink-3);margin-left:8px;white-space:nowrap}
.eskfoot{padding:10px 16px;background:var(--surface-2);border-top:1px solid var(--line);font-size:12.5px;color:var(--ink-3)}
@media (max-width:640px){.eskhead2{flex-direction:column}.eskrow{flex-direction:column;align-items:flex-start;gap:8px}.eskrow.eskcol{display:none}}
@media (max-width:880px){.eppanel{position:fixed}}
@media (max-width:640px){.epfoot{flex-direction:column;align-items:stretch}.epfoot>div{width:100%;justify-content:flex-end;flex-wrap:wrap}.eppro,.eptabs,.epbody{margin-left:14px;margin-right:14px}.eppanel .dh{padding:14px}}
@media (max-width:480px){.epfoot>div .btn{flex:1 1 calc(50% - 4px);justify-content:center}}
/* ===== Add people: how they sign in ===== */
.awlead{margin:0 0 14px;font-size:12.5px;color:var(--ink-3)}
.awsign button.expanded{border-radius:10px 10px 0 0;border-bottom-color:transparent}
.awexp{margin:-8px 0 0;border:1px solid var(--accent);border-top:1px solid var(--accent-edge);border-radius:0 0 10px 10px;background:var(--accent-bg);padding:14px 16px}
.awgrid2{display:grid;grid-template-columns:1fr 1fr;gap:14px 18px}
.pwf{display:flex;align-items:center;gap:6px;border:1px solid var(--line-strong);border-radius:9px;padding:0 6px 0 12px;background:var(--surface)}
.pwf input{border:0;padding:8px 0;flex:1;font:inherit;background:none;color:var(--ink);min-width:0}
.pwf input:focus{outline:0}
.pwf.bad,.inp.bad+.pwf,.pwf:has(input.bad){border-color:var(--bad)}
.pwf .ib{flex:none}
.pwhint{margin:12px 0 0;font-size:12px;color:var(--ink-3)}
.pwtable{display:flex;flex-direction:column;gap:10px}
.pwrow{display:grid;grid-template-columns:1fr 1.4fr 1.4fr;gap:14px;align-items:start}
.pwrow.pwhead{font-size:11px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;color:var(--ink-3)}
.pwname{font-size:13px;font-weight:600;padding-top:9px;color:var(--ink-2)}
.dfw{border-top:1px solid var(--line);background:var(--surface-2)}
.dfw .df{border-top:0;background:none}
.awfoothint{margin:0;padding:0 20px 12px;font-size:12px;color:var(--ink-3)}
@media (max-width:760px){.awgrid2{grid-template-columns:1fr}.pwrow{grid-template-columns:1fr}.pwrow.pwhead{display:none}}

/* mobile: force action rows onto their own guaranteed-width line, so primary
   buttons (Save, Continue, Add People…) can never end up clipped off-screen —
   flex-wrap alone doesn't reliably wrap a nested, unsized button group */
@media (max-width:640px){
 .df{flex-direction:column;align-items:stretch;gap:10px}
 .df .ff{text-align:center}
 .df>div[style*='display:flex']{width:100%;justify-content:flex-end;flex-wrap:wrap}

 .awsteps{gap:10px}
 .awbadges{width:100%;margin-left:0}
}
@media (max-width:540px){
 .df .btn,.df>div[style*='display:flex']>.btn,.edhead .edact .btn{flex:1 1 100%;justify-content:center}
}

function specToSet(name,seen=new Set()){
  const s=new Set();
  (PRESET_SPEC[name]||[]).forEach(t=>{
    if(t[0]==='@'){specToSet(t.slice(1),seen).forEach(x=>s.add(x));return}
    const neg=t[0]==='-';const body=neg?t.slice(1):t;
    const [path,list]=body.split(':');const p=path.split('.');
    const keys=[];
    const addSub=(m,sb,acts)=>{keys.push(m.id+'.'+sb.id);sb.acts.forEach(a=>{if(!acts||acts.includes(a.id))keys.push(m.id+'.'+sb.id+'.'+a.id)})};
    if(p[0]==='*')MODS.forEach(m=>m.subs.forEach(sb=>addSub(m,sb)));
    else{const m=MOD_BY_ID(p[0]);if(!m)return;
      if(p.length===1)m.subs.forEach(sb=>addSub(m,sb));
      else{const sb=m.subs.find(x=>x.id===p[1]);if(!sb)return;
        if(p.length===2)addSub(m,sb,list?list.split(','):null);else keys.push(path);}}
    keys.forEach(k=>neg?s.delete(k):s.add(k));
    if(neg&&p.length===2)[...s].forEach(k=>{if(k.startsWith(path+'.'))s.delete(k)});
  });
  return s;
}
function MOD_BY_ID(id){return MODS.find(m=>m.id===id)}
function presetSet(name,forOwner){
  const s=specToSet(name);
  normalise(s);
  if(!forOwner)[...s].forEach(k=>{const d=DEF[k];if(d&&((d.type==='act'&&d.act.own)||(d.type==='sub'&&d.sub.own)))s.delete(k)});
  return s;
}

function parseCSV(text){
 const lines=text.split(/\r?\n/).filter(l=>l.trim().length);
 if(!lines.length)return [];
 const header=lines[0].split(',').map(h=>h.trim().toLowerCase());
 const idx=(...keys)=>{for(const k of keys){const i=header.indexOf(k);if(i>=0)return i}return -1};
 const fi=idx('first name','first'),li=idx('last name','last'),ei=idx('email'),pi=idx('phone'),ri=idx('role'),xi=idx('extension','ext');
 return lines.slice(1).map(line=>{
  const cols=line.split(',');
  const roleTxt=(ri>=0?cols[ri]:'').trim().toLowerCase();
  const rc=ROLE_CHOICES.find(r=>r[1].toLowerCase()===roleTxt)||ROLE_CHOICES[0];
  return {first:(fi>=0?cols[fi]:'').trim(),last:(li>=0?cols[li]:'').trim(),email:(ei>=0?cols[ei]:'').trim(),
   phone:(pi>=0?cols[pi]:'').trim(),role:rc[0],ext:((xi>=0?cols[xi]:'').trim())||genExt()};
 }).filter(p=>p.first||p.last||p.email).slice(0,10);
}

/* ---------- catalogue index ---------- */
const DEF={};            // key -> {type:'sub'|'act', mod, sub, a, def}
const MOD_BY={};
MODS.forEach(m=>{
  MOD_BY[m.id]=m;
  m.subs.forEach(s=>{
    const sk=m.id+'.'+s.id;
    DEF[sk]={type:'sub',mod:m,sub:s,key:sk,name:s.n};
    s.acts.forEach(a=>{
      const ak=sk+'.'+a.id;
      DEF[ak]={type:'act',mod:m,sub:s,act:a,key:ak,name:a.n};
    });
  });
});
const ALL_KEYS=Object.keys(DEF);
const baseOf=s=>s.base===undefined?(s.acts.find(a=>a.id==='view')?'view':null):s.base;
function label(k){
  const d=DEF[k];if(!d)return k;
  return d.type==='sub'?d.mod.n+' › '+d.sub.n:d.mod.n+' › '+d.sub.n+' › '+d.act.n;
}
function shortLabel(k){const d=DEF[k];return d?(d.type==='sub'?d.sub.n:d.sub.n+' › '+d.act.n):k}

/* every prerequisite of a key: {all:[keys]} and {any:[keys]} */
function prereqs(k){
  const d=DEF[k],all=[],any=[];
  if(!d)return {all,any};
  if(d.type==='act'){
    const sk=d.mod.id+'.'+d.sub.id,b=baseOf(d.sub);
    all.push(sk);
    if(b&&d.act.id!==b)all.push(sk+'.'+b);
    if(d.act.id==='delete'&&d.sub.acts.some(a=>a.id==='edit'))all.push(sk+'.edit');
    (d.act.req||[]).forEach(x=>all.push(x));
    if(d.act.any)any.push(d.act.any);
  }else{
    (d.sub.req||[]).forEach(x=>all.push(x));
    if(d.sub.any)any.push(d.sub.any);
    if(d.mod.req)d.mod.req.forEach(x=>all.push(x));
  }
  return {all,any};
}
/* reverse index for "needed by" */
const NEEDED_BY={};
ALL_KEYS.forEach(k=>{const p=prereqs(k);p.all.forEach(x=>{(NEEDED_BY[x]=NEEDED_BY[x]||[]).push(k)});p.any.forEach(g=>g.forEach(x=>{(NEEDED_BY[x]=NEEDED_BY[x]||[]).push(k)}))});

/* raise everything k needs, recursively; returns keys newly added */
function raise(set,k,out=[]){
  const p=prereqs(k);
  p.all.forEach(x=>{if(DEF[x]&&!set.has(x)){set.add(x);out.push(x);afterAdd(set,x,out);raise(set,x,out)}});
  p.any.forEach(g=>{if(!g.some(x=>set.has(x))){const x=g[0];set.add(x);out.push(x);afterAdd(set,x,out);raise(set,x,out)}});
  return out;
}
/* a submodule switched on brings its required baseline, and its suggested defaults */
function afterAdd(set,k,out,withDefaults){
  const d=DEF[k];
  if(d.type!=='sub')return;
  const b=baseOf(d.sub);
  if(b&&!set.has(k+'.'+b)){set.add(k+'.'+b);out.push(k+'.'+b);raise(set,k+'.'+b,out)}
  if(withDefaults)(d.sub.on||[]).forEach(a=>{const ak=k+'.'+a;if(!set.has(ak)&&!lockReason(ak)){set.add(ak);out.push(ak);raise(set,ak,out)}});
}
function normalise(set){
  for(let pass=0;pass<12;pass++){
    const before=set.size;
    [...set].forEach(k=>{if(!DEF[k]){set.delete(k);return}raise(set,k);if(DEF[k].type==='sub')afterAdd(set,k,[])});
    if(set.size===before)break;
  }
  return set;
}
/* what must go if k goes */
function removalSet(set,k){
  const R=new Set([k]);
  const d=DEF[k];
  if(d.type==='act'){const b=baseOf(d.sub),sk=d.mod.id+'.'+d.sub.id;if(b&&d.act.id===b&&set.has(sk))R.add(sk)}
  for(let pass=0;pass<30;pass++){
    let changed=false;
    set.forEach(x=>{
      if(R.has(x))return;
      const dx=DEF[x];if(!dx)return;
      const p=prereqs(x);
      let dies=p.all.some(y=>R.has(y));
      if(!dies)dies=p.any.some(g=>!g.some(y=>set.has(y)&&!R.has(y)));
      if(!dies&&dx.type==='sub'){const b=baseOf(dx.sub);if(b&&R.has(x+'.'+b))dies=true}
      if(dies){R.add(x);changed=true}
    });
    if(!changed)break;
  }
  return R;
}
/* who is signed in, and what they may grant */
function actorSet(){return new Set(roleById(PERSONAS[S.persona].role).perms)}
function lockReason(k){
  const d=DEF[k];if(!d)return '';
  const own=(d.type==='act'&&d.act.own)||(d.type==='sub'&&d.sub.own);
  if(own&&S.persona!=='owner')return 'Only the account owner can grant this.';
  if(own&&S.edit&&S.edit.id!=='owner')return 'Kept for the Account Owner role only. It can\'t be given to any other role, so there is always exactly one person who can do it.';
  if(S.persona!=='owner'&&!actorSet().has(k))return 'You can\'t grant access you don\'t have yourself.';
  return '';
}
function blockedChain(set,k){
  const tmp=new Set(set);tmp.add(k);
  const up=[k,...raise(tmp,k)];
  const bad=up.filter(x=>!set.has(x)&&lockReason(x));
  return bad;
}
/* module summary: level + counts */
function modCounts(set,m){
  let on=0,tot=0,viewOnly=true,anyOn=false;
  m.subs.forEach(s=>s.acts.forEach(a=>{tot++;const k=m.id+'.'+s.id+'.'+a.id;if(set.has(k)){on++;anyOn=true;if(a.id!=='view'&&!a.ro)viewOnly=false}}));
  let lv='none';
  if(on===tot)lv='full';else if(anyOn&&viewOnly)lv='view';else if(on/tot>=.6)lv='most';else if(on>0)lv='some';
  return {on,tot,lv};
}

  if(a==='epstar'){const p=PEOPLE.find(x=>x.id===S.modal.id),k=act.dataset.k,v=+act.dataset.v;

  if(a==='epnext'){const i=EP_TABS.findIndex(t=>t[0]===S.modal.tab);S.modal.tab=EP_TABS[Math.min(EP_TABS.length-1,i+1)][0];render();return}
  if(a==='epsaveext'){const m=S.modal,p=PEOPLE.find(x=>x.id===m.id);const v=m.ext.trim();
   if(!/^\d{2,6}$/.test(v)){m.extErr='Enter a 2-6 digit extension.';m.extOk=false;render();return}
   if(extTaken(v,p.id)){const owner=PEOPLE.find(x=>x.id!==p.id&&String(x.ext)===v);m.extErr='Ext '+v+' is already used by '+esc(owner.n)+'.';m.extOk=false;render();return}
   p.ext=v;m.extErr=null;m.extOk=true;render();toast('ok','Extension saved','Ext '+v+' now reaches '+esc(p.n)+'.');return}
  if(a==='epsave'){const m=S.modal,p=PEOPLE.find(x=>x.id===m.id);
   const eF=m.first.trim().length<2?'First name must be at least 2 characters':null;

   if(eF||eL){m.errFirst=eF;m.errLast=eL;render();return}
   p.n=(m.first.trim()+' '+m.last.trim()).trim();p.title=m.title.trim();S.modal=null;render();toast('ok','Saved',esc(p.n)+'’s details were updated.');return}
  if(a==='bulk'){S.modal={type:'chrole',ids:[...S.sel]};render();return}
  if(a==='chroleok'){const m=S.modal;const r=roleById(m.role||PEOPLE.find(p=>p.id===m.ids[0]).role);
   m.ids.forEach(id=>{const p=PEOPLE.find(x=>x.id===id);const old=personRole(p).n;const oldR=reachText(p);p.role=r.id;p.reach={lvl:r.reach,ids:['location','group','cc'].includes(r.reach)?[...m.reach]:[]};
    AUDIT.unshift({id:Date.now()+Math.random(),t:'Just now',who:me().n,kind:old===r.n?'reach':'assign',title:p.n+': '+(old===r.n?'reach '+oldR+' → '+reachText(p):old+' → '+r.n),detail:'Reach: '+reachText(p)+'.',people:1,loc:p.loc})});
   S.modal=null;S.sel=new Set();render();toast('ok','Role changed','They see it the next time they open the app. Written to the change history.');return}
  if(a==='checkp'){S.check=id;S.checkKey=null;S.screen='check';render();return}
  if(a==='transfer'){S.modal={type:'transfer'};render();return}
  if(a==='transferok'){const p=PEOPLE.find(x=>x.id===document.getElementById('to').value);S.modal=null;render();toast('info','Not applied in the prototype','In the product '+esc(p.n)+' would get a one-time code, and on confirming would become the Account owner while you became a Location admin with whole-company reach. Left undone here so the demo keeps its owner.');return}
  if(a==='restore'){S.modal={type:'restore',id:+id};render();return}
  if(a==='restoreok'){const au=AUDIT.find(x=>x.id===+id);const r=roleById(au.role);au.add.forEach(k=>r.perms.delete(k));au.rem.forEach(k=>r.perms.add(k));normalise(r.perms);
   AUDIT.unshift({id:Date.now(),t:'Just now',who:me().n,kind:'restore',role:r.id,title:'Put the role "'+r.n+'" back as it was before '+au.t,add:au.rem,rem:au.add,people:roleUsers(r.id).length});S.modal=null;render();toast('ok','Role put back','A new entry is in the history.');return}
 }
 if(or&&!t.closest('button')){openEditor(or.dataset.openrole,'edit');render();document.getElementById('main').scrollTop=0;return}
 const sw=t.closest('[data-sw]');if(sw&&!sw.disabled){toggleKey(sw.dataset.sw,sw.getAttribute('aria-pressed')!=='true');return}
 const mh=t.closest('[data-mod]');if(mh){const id=mh.dataset.mod;S.open.has(id)?S.open.delete(id):S.open.add(id);render();return}
 const j=t.closest('[data-jump]');if(j){S.open.add(j.dataset.jump);S.detail=j.dataset.jump;S.q='';S.onlyOn=false;render();const el=document.getElementById('mod-'+j.dataset.jump);if(el)el.scrollIntoView({behavior:'smooth',block:'start'});return}
 const pr=t.closest('[data-preset]');if(pr){const E=S.edit;if(E.meta.from===pr.dataset.preset)return;if(E.set.size&&changes().n&&[...E.set].length){S.modal={type:'preset',p:pr.dataset.preset};render();return}applyPreset(pr.dataset.preset);render();return}
 const rc=t.closest('[data-reach]');if(rc&&!rc.disabled){S.edit.meta.reach=rc.dataset.reach;Object.keys(S.edit.meta.mreach).forEach(k=>{if(REACH_ORDER.indexOf(S.edit.meta.mreach[k])>=REACH_ORDER.indexOf(rc.dataset.reach))delete S.edit.meta.mreach[k]});render();return}

 const pf=t.closest('[data-pr]');if(pf){S.pplRole=pf.dataset.pr;render();return}
 const af=t.closest('[data-af]');if(af){S.audF=af.dataset.af;render();return}
 const au=t.closest('[data-aud]');if(au){const id=+au.dataset.aud;S.audOpen.has(id)?S.audOpen.delete(id):S.audOpen.add(id);render();return}

 const ak=t.closest('[data-ask]');if(ak){S.checkKey=ak.dataset.ask;render();return}
 const rp=t.closest('[data-rp]');if(rp&&!rp.disabled){S.modal.role=rp.dataset.rp;S.modal.reach=null;render();return}
 const rh=t.closest('[data-rch]');if(rh){const v=rh.dataset.rch,m=S.modal;m.reach=m.reach.includes(v)?m.reach.filter(x=>x!==v):[...m.reach,v];render();return}

function applyPreset(p){const E=S.edit;const set=presetSet(p,false);[...set].forEach(k=>{if(lockReason(k))set.delete(k)});normalise(set);
 [...set].forEach(k=>{if(lockReason(k))set.delete(k)});E.set=set;E.meta.from=p;const r=roleById(p);E.meta.reach=r?r.reach:{t_people:'location',t_reports:'location',t_callflow:'location',t_billing:'own',t_qa:'cc',blank:'own'}[p];E.meta.mreach={};
 S.detail=MODS.find(m=>modCounts(set,m).on)?.id||'phone';S.open=new Set([S.detail])}
document.addEventListener('change',e=>{
 const t=e.target;
 if(t.id==='screensel'){const v=t.value;if(v==='edit'){if(S.screen!=='edit'){openEditor(defaultEditId(),'edit');S.modal=null;render()}return}go(v);return}
 if(t.dataset.selsub){const E=S.edit;if(!E||E.ro)return;const sk=t.dataset.selsub,sub=DEF[sk].sub,base=baseOf(sub);
  if(t.checked){
   const tmp=new Set(E.set);let skipped=0;const pulled=[];
   sub.acts.forEach(a=>{const k=sk+'.'+a.id;if(tmp.has(k))return;if(blockedChain(tmp,k).length){skipped++;return}tmp.add(k);raise(tmp,k,pulled)});
   E.set=tmp;const ext=[...new Set(pulled)].filter(x=>!x.startsWith(sk+'.')&&x!==sk);ext.forEach(x=>S.open.add(DEF[x].mod.id));
   render();
   if(ext.length)toast('ok','Also turned on so this works','<ul>'+ext.map(x=>'<li>'+esc(label(x))+'</li>').join('')+'</ul>');
   else if(skipped)toast('info',skipped+' left off','You can\'t grant access you don\'t have.');
   return}
  const R=new Set();sub.acts.forEach(a=>{const k=sk+'.'+a.id;if(a.id!==base&&E.set.has(k))removalSet(E.set,k).forEach(x=>R.add(x))});
  const ext=[...R].filter(x=>!x.startsWith(sk+'.')&&x!==sk&&E.set.has(x));
  if(!ext.length){R.forEach(x=>E.set.delete(x));render();return}
  S.modal={type:'cascade',k:[...R].find(x=>x.startsWith(sk+'.')),R:[...R]};render();return}
 if(t.id==='selall'){document.querySelectorAll('input[data-sel]:not(:disabled)').forEach(c=>t.checked?S.sel.add(c.dataset.sel):S.sel.delete(c.dataset.sel));render();return}
 if(t.id==='startsel'){const E=S.edit,v=t.value;if(!E||E.meta.from===v)return;if(E.set.size&&changes().n){S.modal={type:'preset',p:v};render();return}applyPreset(v);render();return}
 if(t.dataset.pk){toggleKey(t.dataset.pk,t.checked);return}
 if(t.dataset.sel){t.checked?S.sel.add(t.dataset.sel):S.sel.delete(t.dataset.sel);render();return}
 if(t.dataset.mreach!==undefined&&t.dataset.mreach){const v=t.value;v?S.edit.meta.mreach[t.dataset.mreach]=v:delete S.edit.meta.mreach[t.dataset.mreach];render();return}
 if(t.id==='cp'){S.check=t.value;render();return}
 if(t.id==='pplLocSel'){S.pplLoc=t.value;render();return}
 if(t.id==='pplRoleSel'){S.pplRole=t.value;render();return}
 if(t.id==='pplSeenSel'){S.pplSeen=t.value;render();return}
 if(t.id==='epmgr'){const p=PEOPLE.find(x=>x.id===S.modal.id);p.mgr=t.value||null;if(t.value)S.modal.fieldsErr=false;render();return}
 if(t.id==='eploc'){const p=PEOPLE.find(x=>x.id===S.modal.id);p.loc=t.value;render();return}
 const eppv=t.closest('[data-eppv]');if(eppv&&S.modal&&S.modal.pick){S.modal.pick.val=eppv.dataset.eppv;render();return}
 const emsel=t.closest('[data-act="epmsel"]');if(emsel){const p=PEOPLE.find(x=>x.id===S.modal.id);p.media[emsel.dataset.k].val=t.value;render();return}
 if(t.id==='awloc'){S.modal.loc=t.value;render();return}
 if(t.id==='awrole'){S.modal.people[S.modal.cur].role=t.value;render();return}
 if(t.id==='awfile'){const f=t.files[0];if(!f)return;const rd=new FileReader();
  rd.onload=()=>{try{const rows=parseCSV(rd.result);if(!rows.length){toast('bad','Nothing to import','That file has no rows this template recognises.');return}
   S.modal.people=rows;S.modal.cur=0;S.modal.errors={};render();toast('ok','Imported',rows.length+' '+(rows.length===1?'person':'people')+' loaded from the file.')}
  catch(e){toast('bad','Could not read that file','Check it matches the template.')}};
  rd.readAsText(f);t.value='';return}
});
document.addEventListener('input',e=>{
 const t=e.target;
 const keepFocus=(id)=>{render();const el=document.getElementById(id);if(el){el.focus();const v=el.value;el.setSelectionRange(v.length,v.length)}};
 if(t.id==='rn'||t.id==='rd'){if(t.id==='rn')S.edit.meta.n=t.value;else{S.edit.meta.d=t.value;document.getElementById('rdc').textContent=t.value.length+'/300'}
  const n=changes().n;const st2=document.querySelector('.edhead .st2');if(st2)st2.innerHTML='<b>'+n+' change'+(n===1?'':'s')+'</b>'+(n?' · not saved':' · nothing to save');
  if(t.id==='rn'&&S.nameErr&&t.value.trim()){S.nameErr='';const er=document.querySelector('.ferr');if(er)er.remove();t.classList.remove('bad')}
  document.querySelectorAll('.edhead [data-act="preview"]').forEach(b=>b.disabled=!n&&S.edit.mode==='edit');
  if(t.id==='rn'){const tt=document.getElementById('edtitle'),M=S.edit.meta;if(tt)tt.textContent=M.n||(S.edit.mode==='new'?'New role':S.edit.mode==='copy'?'Copy':'')}return}
 if(t.id==='pq'){S.q=t.value;keepFocus('pq');return}
 if(t.id==='roleQ'){S.roleQ=t.value;keepFocus('roleQ');return}
 if(t.id==='pplQ'){S.pplQ=t.value;keepFocus('pplQ');return}
 if(t.id==='cq'){S.checkQ=t.value;keepFocus('cq');return}
 if(t.id==='awfirst'||t.id==='awlast'||t.id==='awemail'||t.id==='awphone'||t.id==='awext'){
  const p=S.modal.people[S.modal.cur];const map={awfirst:'first',awlast:'last',awemail:'email',awphone:'phone',awext:'ext'};
  p[map[t.id]]=t.value;
  if(S.modal.errors[S.modal.cur]){const e=personErrors(p);if(Object.keys(e).length)S.modal.errors[S.modal.cur]=e;else delete S.modal.errors[S.modal.cur]}
  keepFocus(t.id);return}
 if(t.id==='awpwd1'){S.modal.pwd=t.value;if(S.modal.pwErrs)delete S.modal.pwErrs.pwd;keepFocus(t.id);return}
 if(t.id==='awpwd2'){S.modal.pwd2=t.value;if(S.modal.pwErrs)delete S.modal.pwErrs.pwd2;keepFocus(t.id);return}
 {const mE=t.id.match(/^awpwdE(\d+)([AB])$/);if(mE){const i=+mE[1],f=mE[2]==='A'?'p1':'p2';S.modal.pwds[i]=S.modal.pwds[i]||{};S.modal.pwds[i][f]=t.value;if(S.modal.pwErrs&&S.modal.pwErrs[i])delete S.modal.pwErrs[i][f];keepFocus(t.id);return}}
 if(t.id==='epfirst'){S.modal.first=t.value;if(S.modal.errFirst&&t.value.trim().length>=2)S.modal.errFirst=null;keepFocus(t.id);return}
 if(t.id==='eplast'){S.modal.last=t.value;if(S.modal.errLast&&t.value.trim().length>=2)S.modal.errLast=null;keepFocus(t.id);return}
 if(t.id==='eptitle'){S.modal.title=t.value;keepFocus(t.id);return}
 if(t.id==='epext'){S.modal.ext=t.value;S.modal.extErr=null;S.modal.extOk=false;keepFocus(t.id);return}
});
